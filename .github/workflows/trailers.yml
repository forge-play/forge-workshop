name: Trailers

# Guards the join key the classifier trusts most. `reconciler verify` resolves
# every Idea-Id trailer in this repo's history against docs/ideas.md and exits
# non-zero on one that names an item the doc does not contain. A dangling
# trailer is worse than a missing one.
#
# A history with no trailers passes — the convention is prospective by design.
#
# The repo is passed as `./`, not `.`: willow-reconciler reads a bare `.` as a
# repo name to resolve beside the checkout, while anything carrying a slash is
# a path. The branch list mirrors tests.yml — this is a template, and a
# workshop instantiated from it may default to either.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify-trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the reconciler
        run: pip install "willow-reconciler>=0.6.0"
      - name: Verify Idea-Id trailers resolve
        run: reconciler verify --repo ./ --doc docs/ideas.md
